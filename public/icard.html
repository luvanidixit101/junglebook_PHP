<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Card</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .id-card-container {
    width: 300px;
    background: linear-gradient(45deg, #33691e, #33691e); /* Green gradient color */
    border-radius: 10px;
    box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.4); /* 3D effect shadow */
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden; /* Hide overflowing shadows */
  }
  
  .logo-container {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .square-logo {
    width: 70px; /* Adjust size as needed */
    border-radius: 10px;
    border: 5px solid #8bc34a; /* Light green border */
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }

  .full-logo {
    width: 150px; /* Adjust size as needed */
    border-radius: 10px;
    border: 5px solid #8bc34a; /* Light green border */
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }

  .profile-pic-container {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 0 auto 20px;
    overflow: hidden;
    border-radius: 50%;
    border: 5px solid #fff;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }
  
  .profile-pic {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  .id-card .info {
    text-align: left;
    padding: 0 20px;
  }
  
  .id-card .info p {
    margin: 5px 0;
    font-size: 14px;
    color: #fff; /* White text color for better contrast */
  }

  .id-card .ngo-name {
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: bold;
    color: #fff; /* White text color for better contrast */
  }
</style>
</head>
<body>

<div class="id-card-container">
  <div class="logo-container">
    <img src="square_logo.png" alt="Square Logo" class="square-logo">
  </div>
  <div class="profile-pic-container">
    <img src="profile_picture.jpg" alt="Profile Picture" class="profile-pic">
  </div>
  <div class="id-card">
    <div class="ngo-name">Your NGO Name</div>
    <div class="info">
      <p><strong>ID:</strong> 123456</p>
      <p><strong>Full Name:</strong> John Doe</p>
      <p><strong>Mobile:</strong> (123) 456-7890</p>
      <p><strong>Address:</strong> 123 Main Street, City, Country</p>
    </div>
  </div>
</div>

</body>
</html>
