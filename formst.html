
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forest Study Program Enrollment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Forest Study Program Enrollment</h1>
    <form id="enrollmentForm" action="submit_enrollment.php" method="POST">
      <!-- Personal Information -->
      <fieldset>
        <legend>Personal Information</legend>
        <div class="form-group">
          <label for="fullName">Full Name:</label>
          <input type="text" id="fullName" name="fullName" required>
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number:</label>
          <input type="tel" id="phone" name="phone" required>
        </div>
        <div class="form-group">
          <label for="address">Address:</label>
          <input type="text" id="address" name="address" required>
        </div>
        <div class="form-group">
          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob" required>
        </div>
        <div class="form-group">
          <label for="gender">Gender:</label>
          <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
      </fieldset>

      <!-- Role Information -->
      <fieldset>
        <legend>Role Information</legend>
        <div class="form-group">
          <label for="role">Role:</label>
          <select id="role" name="role" required>
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>
        <div class="form-group">
          <label for="school">School/College Name:</label>
          <input type="text" id="school" name="school" required>
        </div>
        <div class="form-group">
          <label for="educationLevel">Education Level (if student):</label>
          <input type="text" id="educationLevel" name="educationLevel">
        </div>
        <div class="form-group">
          <label for="teachingSubject">Teaching Subject (if teacher):</label>
          <input type="text" id="teachingSubject" name="teachingSubject">
        </div>
      </fieldset>

      <!-- Interests and Experience -->
      <fieldset>
        <legend>Interests and Experience</legend>
        <div class="form-group">
          <label for="areasOfInterest">Areas of Interest (comma-separated):</label>
          <input type="text" id="areasOfInterest" name="areasOfInterest" required>
        </div>
        <div class="form-group">
          <label for="experience">Relevant Experience:</label>
          <textarea id="experience" name="experience" rows="4" required></textarea>
        </div>
      </fieldset>

      <!-- Additional Information -->
      <fieldset>
        <legend>Additional Information</legend>
        <div class="form-group">
          <label for="expectations">Expectations from the Program:</label>
          <textarea id="expectations" name="expectations" rows="4" required></textarea>
        </div>
        <div class="form-group">
          <label for="comments">Comments or Questions:</label>
          <textarea id="comments" name="comments" rows="4"></textarea>
        </div>
      </fieldset>

      <!-- Submit Button -->
      <div class="form-group">
        <button type="submit">Submit</button>
      </div>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>

<script>
    // Basic form validation
document.addEventListener("DOMContentLoaded", function() {
  const form = document.getElementById("enrollmentForm");

  form.addEventListener("submit", function(event) {
    const fullName = document.getElementById("fullName").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const address = document.getElementById("address").value;
    const dob = document.getElementById("dob").value;
    const gender = document.getElementById("gender").value;
    const role = document.getElementById("role").value;
    const school = document.getElementById("school").value;
    const educationLevel = document.getElementById("educationLevel").value;
    const teachingSubject = document.getElementById("teachingSubject").value;
    const areasOfInterest = document.getElementById("areasOfInterest").value;
    const experience = document.getElementById("experience").value;
    const expectations = document.getElementById("expectations").value;

    // Simple validation example, you can add more complex validation as needed
    if (!fullName || !email || !phone || !address || !dob || !gender || !role || !school || !areasOfInterest || !experience || !expectations) {
      alert("Please fill out all required fields.");
      event.preventDefault();
    }
  });
});

</script>
